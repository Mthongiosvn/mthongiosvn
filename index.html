            sidebar.classList.remove('active');

        const particlesContainer = document.getElementById('particles');
        function createParticle() {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 4 + 2;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * window.innerWidth + 'px';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            particlesContainer.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createParticle, 200);
        const glow = document.getElementById('mouseGlow');
        document.addEventListener('mousemove', (e) => {
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

    <script>
    (async function () {
      const products = await BeoStore.loadProducts();

      let currentProductKey = null;
      let selectedPackageIndex = null;

      function openPriceModal(key, product) {
        currentProductKey = key;
        selectedPackageIndex = null;
        document.getElementById('pmImage').src = product.image || '';
        document.getElementById('pmTitle').textContent = product.title || '';
        const body = document.getElementById('pmBody');
        body.innerHTML = '';
        (product.packages || []).forEach((pkg, idx) => {
          const div = document.createElement('div');
          div.className = 'price-option';
          div.innerHTML = `
            <span class="p-name">${BeoStore.escapeHtml(pkg.name)}
              ${product.note ? `<span style="font-size:11px;color:#8b5cf6;">(${BeoStore.escapeHtml(product.note)})</span>` : ''}
            </span>
            <div style="display:flex;align-items:center;">
              <span class="p-price">${BeoStore.escapeHtml(pkg.price)}</span>
              <span class="p-radio"></span>
            </div>`;
          div.addEventListener('click', () => selectPackage(idx, product));
          body.appendChild(div);
        });
        document.getElementById('pmBuyBtn').disabled = true;
        document.getElementById('pmBuyBtn').innerHTML = '<i class="fa-brands fa-telegram"></i> Mua Key';
        document.getElementById('priceModal').classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function selectPackage(idx, product) {
        selectedPackageIndex = idx;
        document.querySelectorAll('#pmBody .price-option')
          .forEach((el, i) => el.classList.toggle('selected', i === idx));
        const pkg = product.packages[idx];
        const btn = document.getElementById('pmBuyBtn');
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-brands fa-telegram"></i> Mua ${BeoStore.escapeHtml(pkg.name)} - ${BeoStore.escapeHtml(pkg.price)}`;
      }

      async function buySelectedPackage() {
        if (currentProductKey === null || selectedPackageIndex === null) return;
        const products = await BeoStore.loadProducts();
        const product = products[currentProductKey];
        if (!product) return;
        const pkg = product.packages[selectedPackageIndex];
        const tg = await BeoStore.loadTelegram();
        const text = encodeURIComponent(
          `Xin chào, mình muốn mua key:\n📦 ${product.title}\n⏱ ${pkg.name}\n💰 ${pkg.price}`
        );
        window.open(`${tg}?text=${text}`, '_blank', 'noopener,noreferrer');
        closePriceModal();
      }

      function closePriceModal() {
        document.getElementById('priceModal').classList.remove('active');
        document.body.style.overflow = '';
        currentProductKey = null;
        selectedPackageIndex = null;
      }

      window.buySelectedPackage = buySelectedPackage;
      window.closePriceModal = closePriceModal;

      BeoStore.renderProductGrid(
        document.getElementById('productGrid'),
        products,
        openPriceModal
      );
    })();
    </script>

    <div class="text-center mt-14 mb-10">
        <span class="inline-block text-[10px] font-black tracking-[0.4em] uppercase px-6 py-2 rounded-full border border-white/50 text-white/70">
            © 2026 MTHONG IOS STORE
        </span>
    </div>

    <!-- AUDIO & SCRIPT ÂM THANH -->
    <audio id="bgMusic" preload="auto"></audio>
    
    <script>
    // ĐỔI LINK NHẠC VÀ TÊN NHẠC Ở 2 MẢNG DƯỚI ĐÂY:
    const playlist = [
        "https://files.catbox.moe/73yb9m.mp3",
        "https://files.catbox.moe/x02zka.mp3"
    ];
    const songNames = [
        "MthongiosvnDJ",
        ""
    ];

    const audioElem = document.getElementById('bgMusic');
    let currentSongIndex = 0;

    function initMusicPlayer() {
        if (!playlist.length) return;
        createMusicControls();
        createSongList();
        createSongNotification();
        playCurrentSong();
        updateMusicIcons('pause'); // Ban đầu ẩn trạng thái đang phát
        audioElem.addEventListener('ended', playNextSong);
    }

    function createMusicControls() {
        const controls = document.createElement('div');
        controls.className = 'music-controls';
        controls.innerHTML = `
            <button class="music-btn" onclick="playPreviousSong()" title="Bài trước">
                <i class="bi bi-skip-backward-fill"></i>
            </button>
            <button class="music-btn" onclick="togglePlayPause()" title="Phát/Tạm dừng">
                <i class="bi bi-play-fill"  id="playIcon"></i>
                <i class="bi bi-pause-fill" id="pauseIcon" style="display:none"></i>
            </button>
            <button class="music-btn" onclick="playNextSong()" title="Bài tiếp theo">
                <i class="bi bi-skip-forward-fill"></i>
            </button>
            <button class="music-btn select-btn" onclick="openSongList()" title="Chọn bài hát">
                <i class="bi bi-music-note-list"></i>
            </button>
        `;
        document.body.appendChild(controls);
    }

    function createSongList() {
        const songList = document.createElement('div');
        songList.className = 'song-list-panel';
        songList.innerHTML = `
            <div class="song-list-header">
                <span>Chọn bài hát</span>
                <button class="close-list-btn" onclick="closeSongList()"><i class="bi bi-x"></i></button>
            </div>
            <div class="song-list-content">
                ${songNames.map((song, i) => `
                    <div class="song-list-item ${i === currentSongIndex ? 'active' : ''}" onclick="selectSong(${i})">
                        <i class="bi bi-music-note"></i>
                        <span>${song}</span>
                        ${i === currentSongIndex ? '<i class="bi bi-check"></i>' : ''}
                    </div>`).join('')}
            </div>
        `;
        document.body.appendChild(songList);
    }

    function createSongNotification() {
        const n = document.createElement('div');
        n.className = 'song-notification';
        n.innerHTML = `
            <div class="notification-content">
                <i class="bi bi-music-note-beamed"></i>
                <span id="currentSongText">Đang phát: ${songNames[0]}</span>
            </div>`;
        document.body.appendChild(n);
    }

    function playCurrentSong() {
        audioElem.src    = playlist[currentSongIndex];
        audioElem.volume = 0.7;
        audioElem.load();
        document.querySelectorAll('.song-list-item')
            .forEach((el, i) => el.classList.toggle('active', i === currentSongIndex));
    }

    function playNextSong() {
        if (!playlist.length) return;
        currentSongIndex = (currentSongIndex + 1) % playlist.length;
        playCurrentSong();
        audioElem.play();
        updateMusicIcons('play');
        showSongNotification();
    }

    function playPreviousSong() {
        if (!playlist.length) return;
        currentSongIndex = (currentSongIndex - 1 + playlist.length) % playlist.length;
        playCurrentSong();
        audioElem.play();
        updateMusicIcons('play');
        showSongNotification();
    }

    function togglePlayPause() {
        if (!playlist.length) return;
        if (audioElem.paused) { 
            audioElem.play();  
            updateMusicIcons('play');  
        } else { 
            audioElem.pause(); 
            updateMusicIcons('pause'); 
        }
    }

    function updateMusicIcons(state) {
        document.getElementById('playIcon').style.display  = state === 'play' ? 'none'  : 'block';
        document.getElementById('pauseIcon').style.display = state === 'play' ? 'block' : 'none';
    }

    function openSongList()  { document.querySelector('.song-list-panel').classList.add('show');    }
    function closeSongList() { document.querySelector('.song-list-panel').classList.remove('show'); }

    function selectSong(index) {
        if (!playlist[index]) return;
        currentSongIndex = index;
        playCurrentSong();
        audioElem.play()
            .then(() => { updateMusicIcons('play');  showSongNotification(); closeSongList(); })
            .catch(() => { updateMusicIcons('pause'); showSongNotification(); closeSongList(); });
    }

    function showSongNotification() {
        const n = document.querySelector('.song-notification');
        document.getElementById('currentSongText').textContent = `Đang phát: ${songNames[currentSongIndex]}`;
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 3000);
    }

    window.onload = function () { initMusicPlayer(); };
    </script>

</body>
</html>
